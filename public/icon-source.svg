<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Chess Coach app icon: original artwork (GPL-3.0-or-later, like the rest of this repository).
    Full-bleed master for apple-touch-icon-180x180.png and maskable-icon-512x512.png. iOS and
    Android apply their own corner mask, so the corners stay square. The background fades to the
    flat #1d1c1a well before the edges, so padding it with #1d1c1a (maskable safe zone) is seamless.
    The rounded, transparent variant used for favicons and the "any" icons is favicon.svg.

    The PNGs are committed. They were made with @vite-pwa/assets-generator (run ad hoc, not a
    dependency): from this file, apple 180 (padding 0) and maskable 512 (padding 0.14), both on
    #1d1c1a and saved without alpha; from favicon.svg, pwa-64/192/512 and favicon.ico (padding 0).
    splash/*.png are favicon.svg at 112 pt, centred at 45% height on #1d1c1a / #f4f1ec (sharp).
  -->
  <defs>
    <radialGradient id="bg" cx="256" cy="232" r="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#37332e"/>
      <stop offset="0.78" stop-color="#1d1c1a"/>
    </radialGradient>
    <linearGradient id="piece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2dcd1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#72c081"/>
      <stop offset="1" stop-color="#4b9a5b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Artwork is drawn on a 100-unit grid. -->
  <g transform="translate(60 66) scale(4.1)">
    <!-- Knight, facing left, with a five-lock mane. -->
    <path fill="url(#piece)" d="M33 76
      C31 72 29 68 30 63
      C31 58.5 34 55.5 39.5 53
      C35 54.5 27 55 21.5 54
      C16 53 12 50 11.8 46
      C11.6 42.5 13.5 40 16.5 37.5
      C24 29 36 20 48 16.5
      C51 14 54 10 56.5 6
      C59.5 9.5 61.5 14 61 19
      C63.32 18.19 65.98 22.16 65.62 23.88
      C68.1 23.55 70.26 28.25 69.67 29.96
      C72.19 30.1 73.65 35.36 72.81 37
      C75.27 37.63 75.81 43.26 74.7 44.76
      C76.98 45.91 76.39 51.71 75 53
      C74.5 62 72.5 70 71 76 Z"/>
    <rect x="24" y="78" width="52" height="9" rx="3.5" fill="url(#piece)"/>
    <circle cx="42" cy="28" r="2.4" fill="#1d1c1a"/>
    <!-- Coach badge: a "good move" check in the app's accent green. -->
    <circle cx="78.5" cy="16" r="12.5" fill="#1d1c1a"/>
    <circle cx="78.5" cy="16" r="10.2" fill="url(#accent)"/>
    <path d="M73.6 16.3 L77 19.7 L83.6 12.7" fill="none" stroke="#ffffff" stroke-width="2.6"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
