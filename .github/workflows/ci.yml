# Checks pull requests and work branches: unit tests, typecheck + production build, and the
# Playwright PWA smoke test (manifest, service worker, offline reload, engine files).
# Pushes to main are checked by deploy.yml, which runs the same tests before publishing.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

# Newer pushes to the same branch or PR supersede older runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24 # @lichess-org/chessground declares engines.node >= 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build # tsc --noEmit && vite build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright PWA tests
        run: npx playwright test # builds with vite and serves it with vite preview (playwright.config.ts)

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
