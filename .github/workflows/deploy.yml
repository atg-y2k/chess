# Builds the app and publishes it to GitHub Pages at https://<owner>.github.io/chess/.
# One-time setup: repository Settings > Pages > Build and deployment > Source = "GitHub Actions".
# (Pages needs a public repository on GitHub Free.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code, write Pages, and mint the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Do not cancel a deployment that is already running; the newest queued
# run replaces older queued ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24 # @lichess-org/chessground declares engines.node >= 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build # tsc --noEmit && vite build
        env:
          # Project site path. Use "/" for a custom domain or a <owner>.github.io repository.
          BASE_PATH: /chess/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
