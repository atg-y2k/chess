# Tests the app, builds it and publishes it to GitHub Pages at https://<owner>.github.io/chess/.
# Nothing is published unless the unit tests and the Playwright end-to-end tests (run against a
# /chess/ build, like the published one) pass: installed apps pick up a new version by themselves.
# One-time setup: repository Settings > Pages > Build and deployment > Source = "GitHub Actions".
# (Pages needs a public repository on GitHub Free.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code, write Pages, and mint the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Do not cancel a deployment that is already running; the newest queued
# run replaces older queued ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24 # @lichess-org/chessground declares engines.node >= 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Legal pages
        # public/privacy.html, terms.html and support.html are published with the web app. Until the
        # owner fills in their placeholders (docs/APP_STORE.md, section 18) this only warns; the iOS
        # release workflow refuses a release while any are left.
        run: node scripts/check-legal-pages.mjs

      - name: Build
        run: npm run build # tsc --noEmit && vite build
        env:
          # Project site path. Use "/" for a custom domain or a <owner>.github.io repository.
          BASE_PATH: /chess/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # Same end-to-end tests as ci.yml, against the Pages layout. Playwright builds the app itself
  # (playwright.config.ts) with the same settings as the build job.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e tests
        run: npx playwright test
        env:
          BASE_PATH: /chess/
          # Fail if the app does not register its service worker itself (src/main.tsx).
          E2E_REQUIRE_APP_SW: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
